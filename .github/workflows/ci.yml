# Run the tests on every push and pull request.
#
# 1. zeropage: its portable (.cljc) tests on the JVM, then all of its tests
#    in Node (npm run test:node). The Node tests run generated 6502 code on
#    the CPU from nes-cljs, which is a sibling checkout (see below).
# 2. cartridj: its portable (.cljc) tests on the JVM. These also build the
#    catch and hello games, to check ROM output.
# 3. games: each game builds its ROM and names file, its ClojureScript
#    tests run in Node (all in one build: see games/deps.edn), and
#    alienscape's importer test runs on the JVM.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zeropage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/zeropage
    steps:
      - uses: actions/checkout@v7

      # zeropage's :test alias depends on ../../../nes-cljs (its 6502 CPU, the
      # oracle the tests run generated code on): next to this checkout.
      - name: Check out nes-cljs
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 https://github.com/dfornika/nes-cljs.git ../nes-cljs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: libs/zeropage/package-lock.json

      - name: Install the Clojure CLI
        run: |
          curl -fsSL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('libs/*/deps.edn', 'games/*/deps.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - run: npm ci

      # The code that isn't tied to the browser, on the JVM
      - name: Unit tests (JVM)
        run: npm run test:jvm

      - name: Unit tests (Node)
        run: npm run test:node

  cartridj:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/cartridj
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Clojure CLI
        run: |
          curl -fsSL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('libs/*/deps.edn', 'games/*/deps.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - name: Unit tests (JVM)
        run: clojure -M:test:test-jvm

  games:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games
    steps:
      - uses: actions/checkout@v7

      # The games' tests run on nes-cljs's 6502 CPU, like zeropage's
      - name: Check out nes-cljs
        working-directory: ${{ github.workspace }}
        run: git clone --depth 1 https://github.com/dfornika/nes-cljs.git ../nes-cljs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: games/package-lock.json

      - name: Install the Clojure CLI
        run: |
          curl -fsSL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('libs/*/deps.edn', 'games/*/deps.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - run: npm ci

      - name: Unit tests (Node)
        run: npm run test:node

      - name: Alienscape importer test (JVM)
        working-directory: games/alienscape
        run: clojure -M:test-jvm

      # Every game builds a ROM and its names file
      - name: Build the ROMs
        run: |
          for game in catch hello hopper tower star-run ladder alienscape; do
            (cd "$game" && clojure -T:build rom)
          done
